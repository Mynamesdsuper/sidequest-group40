# SonarCloud analysis of the backend (sonar-project.properties at the repository root).
# Until task SONAR-SETUP adds the SONAR_TOKEN secret and the project key, the job only prints a notice.
name: sonar

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://sidequest:sidequest@localhost:5432/sidequest_test
      TEST_DATABASE_URL: postgres://sidequest:sidequest@localhost:5432/sidequest_test
      TOKEN_SECRET: ci-only-secret-not-used-anywhere-else
      TOKEN_EXPIRES_IN: 2h
      FRONTEND_ORIGIN: http://localhost:4200
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sidequest -d sidequest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Not configured yet
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SonarCloud not configured yet (task SONAR-SETUP)"
      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0 # full history: Sonar needs it for blame and new-code detection
      - uses: actions/setup-node@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend tests with coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        run: npm ci && npm run db:migrate && npm run test:coverage
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
