# SPA: unknown paths (e.g. /teams/42 after a reload) are answered with index.html and Angular routes them.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles (outputHashing: all) never change: cache them; index.html is always revalidated.
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
