# SonarCloud analysis of the backend. The organization and project key are set in task SONAR-SETUP (P3).
sonar.organization=<to-be-set-in-SONAR-SETUP>
sonar.projectKey=<to-be-set-in-SONAR-SETUP>
sonar.projectName=SideQuest Group 40 - backend

sonar.sources=backend/src
sonar.tests=backend/tests
sonar.exclusions=backend/src/db/migrations/**,backend/src/db/seeds/**
sonar.coverage.exclusions=backend/src/db/migrations/**,backend/src/db/seeds/**,backend/src/server.ts,backend/src/db/cli.ts
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
