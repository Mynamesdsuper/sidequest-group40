# Full stack for the exam demo: database + backend + frontend, all built from this repository.
# Usage: `docker compose -f docker-compose.demo.yml up --build`, then open http://localhost:4200.
# Separate project name and volume: it never touches the development database of docker-compose.yml.
# Stop with `docker compose -f docker-compose.demo.yml down` (add `-v` to wipe the demo data).
name: sidequest-demo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
      POSTGRES_DB: sidequest_demo
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sidequest -d sidequest_demo']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://sidequest:sidequest@db:5432/sidequest_demo
      # The backend refuses `change-me` in production. Override it with TOKEN_SECRET=... in the shell.
      TOKEN_SECRET: ${TOKEN_SECRET:-sidequest-local-demo-secret}
      TOKEN_EXPIRES_IN: 2h
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-4200}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 5
    # The image only migrates; the demo also needs the seeds (idempotent) for the demo accounts.
    command: ['sh', '-c', 'node dist/db/cli.js migrate && node dist/db/cli.js seed && node dist/server.js']
    # Published on 3000 because the frontend build calls http://localhost:3000/api/v1 from the browser.
    # Bound to 127.0.0.1 only: the demo TOKEN_SECRET is public, so the API must not be reachable from the network.
    ports:
      - '127.0.0.1:3000:3000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-4200}:80'

volumes:
  demo-db-data:
